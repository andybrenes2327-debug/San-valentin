<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¿Quieres ser mi San Valentín?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="./minion1.jfif" class="decoracion izq" alt="corazon">
    <img src="./minion2.jfif" class="decoracion der" alt="corazon">

    <div class="container">
        <h1>¿Quieres ser mi San Valentín? ❤️</h1>
        <div class="gif-main">
            <img src="./snop.jfif" alt="tierno">
        </div>
        
        <div class="buttons">
            <button class="btn si" onclick="irAlSi()">¡SÍ!</button>
            <button class="btn no" id="btnNo" onmouseover="moverBoton()" onclick="contarNo()" ontouchstart="moverBoton()">No...</button>
        </div>
    </div>

    <script>
        let intentosNo = 0;

        function moverBoton() {
            const btnNo = document.getElementById('btnNo');
            // Calculamos límites para que no se salga de la pantalla visible
            const padding = 50;
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - padding);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - padding);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        function contarNo() {
            intentosNo++;
            if (intentosNo >= 2) {
                alert("¿Otra vez? 🥺 ¿Estás muy segura? Inténtalo otra vez...");
                intentosNo = 0;
            }
        }

        function irAlSi() {
            window.location.href = "si.html";
        }
    </script>
</body>
</html>
